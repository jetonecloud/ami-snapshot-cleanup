[project]
name = "ami-snapshot-cleanup"
version = "1.0.0"
description = "Find unused AMIs and EBS snapshots and clean them up safely. Dry run by default."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/jetonecloud/ami-snapshot-cleanup"

[project.scripts]
ami-snapshot-cleanup = "cleanup:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cleanup"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
