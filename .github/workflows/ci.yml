name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install boto3 pytest moto ruff mypy
      - name: Lint
        run: ruff check cleanup.py tests/
      - name: Type check
        run: mypy cleanup.py
      - name: Test
        run: pytest -q
